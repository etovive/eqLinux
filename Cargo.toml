[package]
name = "eqlinux"
version = "0.1.0"
edition = "2021"
description = "System-wide audio equalizer and volume mixer for Linux, inspired by eqMac"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libpulse-binding = "2.29"
libpulse-simple-binding = "2.29"
bytemuck = { version = "1", features = ["derive"] }
rustfft = "6"
arc-swap = "1"
dirs = "6"
hound = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
